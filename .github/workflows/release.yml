name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a stable version tag on main history
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'version=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: [validate, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, x86_64-macos, aarch64-macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: '2026.9.18'
          cache: false
      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mise exec -- zig build -Doptimize=ReleaseSafe -Dtarget="$TARGET" --prefix release-out
          name="zig-parslet-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp release-out/bin/peg_parse release-out/bin/peg_test release-out/bin/peg_transform "dist/$name/"
          cp README.md SPEC.md "dist/$name/"
          cp -R examples "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No repository checkout or execution of build artifacts in this privileged job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Check assets and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          # Refuse to attach binaries to a tag moved since validation/build.
          actual_commit=$(gh api "repos/$GH_REPO/commits/$VERSION" --jq '.sha')
          test "$actual_commit" = "$EXPECTED_COMMIT"
          cd dist
          archives=()
          for target in x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos; do
            file="zig-parslet-${VERSION}-${target}.tar.gz"
            test -s "$file"
            archives+=("$file")
          done
          sha256sum "${archives[@]}" > SHA256SUMS
          gh release create "$VERSION" "${archives[@]}" SHA256SUMS \
            --verify-tag --generate-notes --title "Zig Parslet $VERSION"
