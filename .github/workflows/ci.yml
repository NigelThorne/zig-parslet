name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        optimize: [Debug, ReleaseSafe]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: '2026.9.18'
          cache: false
      - name: Lint workflows
        if: matrix.os == 'ubuntu-24.04' && matrix.optimize == 'Debug'
        run: mise exec actionlint@1.7.12 -- actionlint
      - name: Check formatting
        run: mise exec -- zig fmt --check build.zig src
      - name: Run library tests and build commands
        env:
          OPTIMIZE: ${{ matrix.optimize }}
        run: |
          mise exec -- zig build test -Doptimize="$OPTIMIZE" --summary all
          mise exec -- zig build -Doptimize="$OPTIMIZE"
      - name: Run CLI acceptance tests
        run: python3 tests/cli_test.py
      - name: Run deterministic fuzz tests
        run: python3 tests/fuzz_test.py
